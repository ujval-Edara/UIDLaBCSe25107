<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            transition: width 5s ease 2s, height 5s ease 2s;
            transition-delay: 0.2s;
        }
        div:hover{
            height: 300px;
            width: 300px;

        }
        img{
            width: 100px;
            height:100px;
            transition: width 5s ease 2s, height 5s ease 2s;
            transition-delay: 0.2s;
        }
        img:hover{
            height: 300px;
            width: 300px;

        }

    </style>
</head>
<body>
    <div style="background-color: aqua;"></div>

    <br>
    <div style="background-color: black;"></div>
    <br>

    <div style="background-color: crimson;"></div>
    <br>
    <img src=helmet.jpg alt=helmet width="100px" height="100px">
</body>
</html>
