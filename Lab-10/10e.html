<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Grade calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-card">
        <h2>Student Grade Calculator</h2>
        <p>Enter 6 subject marks:</p>
        
        <input type="number" id="num1" placeholder="Num 1">
        <input type="number" id="num2" placeholder="Num 2">
        <input type="number" id="num3" placeholder="Num 3">
        <input type="number" id="num4" placeholder="Num 4">
        <input type="number" id="num5" placeholder="Num 5">
        <input type="number" id="num6" placeholder="Num 6">
        
        <button onclick="gradecalculator()">Calculate Grade</button>
        
        <div id="result"></div>
    </div>



    <script>
        const display = document.getElementById('result');
        display.innerHTML = "";
        function gradecalculator() {

            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const n3 = parseFloat(document.getElementById('num3').value);
            const n4 = parseFloat(document.getElementById('num4').value);
            const n5 = parseFloat(document.getElementById('num5').value);
            const n6 = parseFloat(document.getElementById('num6').value);


            if (isNaN(n1) || isNaN(n2) || isNaN(n3) || isNaN(n4) || isNaN(n5) || isNaN(n6)) {
                alert("⚠️ Please enter all 6 marks!");
                return;
            }

            const avg = (n1+n2+n3+n4+n5+n6) / 6;
            display.innerHTML += `Average: ${avg}% <br>`
            
            if (avg < 60) {
                display.innerHTML += `F Grade`;
            }
            else if (avg < 70) {
                display.innerHTML += `D Grade`;
            }
            else if (avg < 80) {
                display.innerHTML += `C Grade`;
            }
            else if (avg < 90) {
                display.innerHTML += `B Grade`;
            }
            else {
                display.innerHTML += `A Grade`;
            }
        }
    </script>
</body>
</html>
