<!DOCTYPE html>
<html>
<head>
    <title>3-Number Sorter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-card">
        <h2>Number Sorter</h2>
        <p>Enter 3 numbers to sort them:</p>
        
        <input type="number" id="num1" placeholder="Num 1">
        <input type="number" id="num2" placeholder="Num 2">
        <input type="number" id="num3" placeholder="Num 3">
        
        <button onclick="sortNumbers()">Sort Ascending</button>
        
        <div id="result"></div>
    </div>


    <script>
        function sortNumbers() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const n3 = parseFloat(document.getElementById('num3').value);
            const display = document.getElementById('result');

            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                display.innerText = "Please enter all numbers";
                display.style.color = "#f87171";
                return;
            }

            let sortedResult = "";

            if (n1 <= n2 && n1 <= n3) {
                if (n2 <= n3) {
                    sortedResult = n1 + ", " + n2 + ", " + n3;
                } else {
                    sortedResult = n1 + ", " + n3 + ", " + n2;
                }
            } 
            else if (n2 <= n1 && n2 <= n3) {
                if (n1 <= n3) {
                    sortedResult = n2 + ", " + n1 + ", " + n3;
                } else {
                    sortedResult = n2 + ", " + n3 + ", " + n1;
                }
            } 
            else {
                if (n1 <= n2) {
                    sortedResult = n3 + ", " + n1 + ", " + n2;
                } else {
                    sortedResult = n3 + ", " + n2 + ", " + n1;
                }
            }

            alert("Sorted: " + sortedResult);
        }
    </script>
</body>
</html>
