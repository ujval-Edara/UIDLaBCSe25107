<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Sign Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-card">
        <h2>Sign Checker</h2>
        <p>Determine the sign of the product</p>
        
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">
        <input type="number" id="num3" placeholder="Enter third number">
        
        <button onclick="checkSign()">Check Sign</button>
        
        <div id="result"></div>
    </div>


    <script>
        function checkSign() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const n3 = parseFloat(document.getElementById('num3').value);
            const display = document.getElementById('result');

            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                display.innerText = "Fill all fields";
                return;
            }

            const product = n1 * n2 * n3;

            if (product > 0) {
                alert("The sign is [+]");
            } else if (product < 0) {
                alert("The sign is [-]");
            } else {
                alert("The product is 0");
            }
        }
    </script>
</body>
</html>
