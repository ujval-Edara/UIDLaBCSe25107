<!DOCTYPE html>
<html lang="en">
<head>
    <title>Greatest number finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-card">
        <h2>Greater number finder</h2>
        <p>Enter 5 numbers:</p>
        
        <input type="number" id="num1" placeholder="Num 1">
        <input type="number" id="num2" placeholder="Num 2">
        <input type="number" id="num3" placeholder="Num 3">
        <input type="number" id="num4" placeholder="Num 4">
        <input type="number" id="num5" placeholder="Num 5">
        
        <button onclick="findGreatest()">Find Greatest</button>
        
        <div id="result"></div>
    </div>
-

    <script>
        function findGreatest() {

            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const n3 = parseFloat(document.getElementById('num3').value);
            const n4 = parseFloat(document.getElementById('num4').value);
            const n5 = parseFloat(document.getElementById('num5').value);


            if (isNaN(n1) || isNaN(n2) || isNaN(n3) || isNaN(n4) || isNaN(n5)) {
                alert("⚠️ Please enter all 5 numbers!");
                return;
            }

            // "King of the Hill" logic
            let greatest = n1;

            if (n2 > greatest) {
                greatest = n2;
            }
            if (n3 > greatest) {
                greatest = n3;
            }
            if (n4 > greatest) {
                greatest = n4;
            }
            if (n5 > greatest) {
                greatest = n5;
            }

            alert("The greatest number is: " + greatest);
        }
    </script>
</body>
</html>
