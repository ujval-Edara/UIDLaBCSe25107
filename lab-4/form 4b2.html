<!DOCTYPE html>
<html lang="en">
<head>
    <title>I FRAMES</title>
</head>
<body>
    <CENTER>
        <table border="black">
            <caption style="text-align: center;">User Registration</caption>
            <tr>
                <th>
                    <label for="unname"><i>FullName :</i></label>
                </th>
                <th><input type="name" id=uname></th>
            </tr>
            <tr>
                <td><label for=email><i>Email :</i></label></td>
                <td><input type="email" id="email"></td>
            </tr>
            <tr>
                <td><label for="phn"><i>PhoneNumber</i></label></td>
                <td><input type="number" id="phn"></td>
            </tr>
            <tr>
                <td><label for=pass><i>PassWord :</i></label></td>
                <td><input type="password" id="pass"></td>
            </tr>
            <tr >
                <td colspan="2" style="text-align: center;"><button>Register</button> <input type=reset></td>
                
            </tr>
        </table>
    </CENTER>
    
</body>
</html>
