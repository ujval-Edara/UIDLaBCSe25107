    <h2>SVG RECTANGLE EXAMPLE</h2>
    <svg width="300" height="200">
        <rect x="50" y="50" width="200" height="100" fill="green" stroke="black" stroke-width="3"></rect>

    </svg>

    <h2>SVG EXAMPLE WITH CIRCLE</h2>
    <svg width="400" height="200">
        <circle r="50" cx="100" cy="110" fill="white" stroke="black" stroke-width="2"></circle>

    </svg>

    <svg width="300" height="100">
        <line x1="10" y1="10" x2="300" y2="200" fill="green" stroke="pink" stroke-width="1"></line>
    </svg>
